name: Build PS2 ELF

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build PS2 Binary
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Toolchain Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential wget libgmp-dev

      - name: Download and Extract PS2DEV Prebuilt Toolchain
        run: |
          export PS2DEV=/opt/ps2dev
          export PS2SDK=$PS2DEV/ps2sdk
          sudo mkdir -p $PS2DEV
          sudo chown -R $USER:$USER /opt/ps2dev
          
          wget https://github.com/ps2dev/ps2dev/releases/download/latest/ps2dev-ubuntu-latest.tar.gz
          tar -xf ps2dev-ubuntu-latest.tar.gz -C /opt/ps2dev
          
          echo "PS2DEV=/opt/ps2dev" >> $GITHUB_ENV
          echo "PS2SDK=/opt/ps2dev/ps2sdk" >> $GITHUB_ENV
          echo "/opt/ps2dev/bin" >> $GITHUB_PATH
          echo "/opt/ps2dev/ee/bin" >> $GITHUB_PATH

      - name: Build Project
        run: make -f Makefile.ps2

      - name: Upload ELF Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gamate-elf
          path: gamate.elf