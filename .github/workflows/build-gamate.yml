name: Build PS2 ELF

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build PS2 Binary
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Host Build Essentials
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - name: Setup PS2SDK Toolchain
        uses: ps2dev/setup-ps2dev@v1

      - name: Build Project
        run: make -f Makefile.ps2

      - name: Upload ELF Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gamate-elf
          path: gamate.elfname: Build PS2 ELF

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build with PS2SDK (Docker)
    runs-on: ubuntu-latest

    container:
      image: ps2dev/ps2dev:latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Host Dependencies (CMake)
        run: |
          apk update && apk add cmake

      - name: Configure CMake for PS2
        run: |
          mkdir build && cd build
          cmake -DCMAKE_TOOLCHAIN_FILE=${PS2SDK}/samples/cmake/ps2lib.cmake ..

      - name: Compile Project
        run: |
          cd build
          make

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gamate-elf
          path: build/gamate.elf
