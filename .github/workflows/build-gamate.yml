name: Build PS2 ELF

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build with PS2SDK (Docker)
    runs-on: ubuntu-latest

    # Use the official pre-built ps2dev container environment
    container:
      image: ps2dev/ps2dev:latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure CMake for PS2
        run: |
          mkdir build && cd build
          cmake -DCMAKE_TOOLCHAIN_FILE=${PS2SDK}/samples/cmake/ps2lib.cmake ..

      - name: Compile Project
        run: |
          cd build
          make

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gamate-elf
          path: build/gamate.elf