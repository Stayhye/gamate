name: Build PS2 ELF

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build PS2 Binary
    runs-on: ubuntu-latest
    container:
      image: ps2dev/ps2dev:latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Make
        run: |
          apk update && apk add make build-base

      - name: Build Project
        run: |
          make -f Makefile.ps2

      - name: Upload ELF Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gamate-elf
          path: gamate.elf